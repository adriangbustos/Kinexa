    <style>
      /* Bevel Design Tokens from DESIGN.md */
      :root {
        --color-paper-white: #ffffff;
        --color-charcoal: #1f2025;
        --color-ink: #222326;
        --color-cloud-card: #ebf0f8;
        --color-body-gray: #747679;
        --color-signal-gold: #ffca00;
        --color-coral-signal: #ffab94;
        --color-recovery-green: #31ce01;
        --color-metric-blue: #415eee;
        --color-sleep-lilac: #b9a6ff;
        --gradient-hero-sky: linear-gradient(180deg, #d2e5ff 0%, #fff9ee 45%, #ffffff 100%);

        --radius-cards: 24px;
        --radius-buttons: 128px;
        --radius-navigation: 32px;
      }

      /* Hallmark Floor #4: overflow-x: clip on html and body. Never hidden, never 100vw */
      html, body {
        overflow-x: clip;
        max-width: 100%;
        margin: 0;
        padding: 0;
        background-color: var(--color-paper-white);
        color: var(--color-ink);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        font-size: 16px;
        line-height: 1.4;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      /* Bevel display typography: 600 weight, tight tracking */
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        overflow-wrap: break-word;
        min-width: 0;
        color: var(--color-ink);
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }

      /* Hallmark Floor #6: instant :focus-visible */
      :focus-visible {
        outline: 2px solid var(--color-charcoal);
        outline-offset: 2px;
      }

      /* Responsive touch target standards */
      @media (pointer: coarse) {
        button, a, input, select {
          min-height: 44px;
        }
      }

      /* Hallmark Floor #7: prefers-reduced-motion fallback */
      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
